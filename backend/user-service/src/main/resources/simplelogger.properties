log4j2.loggerContextFactory=org.apache.logging.log4j.simple.SimpleLoggerContextFactory
log4j.ignoreTCL=true

org.apache.logging.log4j.simplelog.level=INFO
org.apache.logging.log4j.simplelog.showdatetime=true
org.apache.logging.log4j.simplelog.showlogname=true
org.apache.logging.log4j.simplelog.dateTimeFormat=yyyy-MM-dd HH:mm:ss.SSS

org.apache.logging.log4j.simplelog.logFile=System.out