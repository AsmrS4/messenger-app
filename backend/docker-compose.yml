version: '3.8'
services:
  user-service:
    build:
      context: .
      dockerfile: user-service/Dockerfile
    container_name: user-service
    environment:
      - USER_DB_URL=jdbc:postgresql://users-db:5432/users_db
      - USER_DATASOURCE_USER=postgres
      - USER_DATASOURCE_PASSWORD=postgres
    ports:
      - '8001:8001'
    depends_on:
      users-db:
        condition: service_healthy
    networks:
      - app-network

  auth-service:
    build:
      context: .
      dockerfile: authorization-service/Dockerfile
    container_name: auth-service
    environment:
      - AUTH_DB_URL=jdbc:postgresql://auth-db:5432/auth_db
      - AUTH_DATASOURCE_USER=postgres
      - AUTH_DATASOURCE_PASSWORD=postgres
    ports:
      - '8002:8002'
    depends_on:
      auth-db:
        condition: service_healthy
    networks:
      - app-network

  users-db:
    image: postgres:15
    container_name: users-database
    environment:
      - POSTGRES_USER=${USER_DATASOURCE_USER:-postgres}
      - POSTGRES_PASSWORD=${USER_DATASOURCE_PASSWORD:-postgres}
      - POSTGRES_DB=users_db
    volumes:
      - users_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  auth-db:
    image: postgres:15
    container_name: auth-database
    environment:
      - POSTGRES_USER=${AUTH_DATASOURCE_USER:-postgres}
      - POSTGRES_PASSWORD=${AUTH_DATASOURCE_PASSWORD:-postgres}
      - POSTGRES_DB=auth_db
    volumes:
      - auth_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-postgres}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  users_data:
  auth_data:

networks:
  app-network:
    driver: bridge