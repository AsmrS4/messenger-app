server:
  port: ${AUTH_PORT:8002}
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
      force-request: true
      force-response: true
  tomcat:
    uri-encoding: UTF-8
    forward-headers-strategy: framework

spring:
  application:
    name: authorization-service

  datasource:
    url: ${AUTH_DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${AUTH_DATASOURCE_USERNAME:postgres}
    password: ${AUTH_DATASOURCE_PASSWORD:postgres}

  flyway:
    enabled: true
    locations: classpath:db/migrations
    baseline-on-migrate: true

jwt:
  secret-key: ${SECRET_KEY:devSecretKeyForLocalDevelopmentOnly123456789}
  life-time: ${ACCESS_LIFETIME:30m}